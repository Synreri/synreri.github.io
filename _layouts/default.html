<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="theme-color" content="#587137"><link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/jpeg" href="{{ '/assets/images/avatar.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">跳转到内容</a>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}首页"><img class="mark" src="{{ '/assets/images/avatar.jpg' | relative_url }}" width="52" height="52" alt=""><span>{{ site.title | escape }}</span></a>
      <nav class="nav" aria-label="主导航"><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>文章</a><a href="{{ '/' | relative_url }}#about">关于</a></nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer><span>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</span><span><a href="https://github.com/synreri/synreri.github.io/tree/main/_posts" target="_blank" rel="noopener noreferrer">写作入口</a><span aria-hidden="true"> · </span>学习不停，生活继续。</span></footer>
  </div>
  {% if page.url == '/' %}<script src="{{ '/assets/js/legacy-links.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
